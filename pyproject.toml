[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pin-assistant"
version = "0.1.0"
description = "Private planning assistant runtime"
requires-python = ">=3.12,<3.13"
dependencies = [
    "aiogram>=3.22,<4",
    "aiohttp>=3.12,<4",
    "alembic>=1.16,<2",
    "httpx>=0.28,<1",
    "psycopg[binary]>=3.2,<4",
    "pydantic>=2.11,<3",
    "python-dateutil>=2.9,<3",
    "sqlalchemy[asyncio]>=2.0.43,<2.1",
    "tzdata>=2025.2",
]

[project.optional-dependencies]
speech = ["faster-whisper>=1.2,<2"]

[dependency-groups]
dev = [
    "mypy>=1.18,<2",
    "hypothesis>=6.140,<7",
    "pytest>=8.4,<9",
    "pytest-asyncio>=1.2,<2",
    "ruff>=0.13,<1",
]

[project.scripts]
pin-gateway = "pin.entrypoints.gateway:main"
pin-app-worker = "pin.entrypoints.app_worker:main"
pin-delivery-worker = "pin.entrypoints.delivery_worker:main"
pin-billing-refund = "pin.entrypoints.billing_refund:main"
pin-speech-worker = "pin.entrypoints.speech_worker:main"
pin-architecture-check = "pin.architecture:main"

[tool.hatch.build.targets.wheel]
packages = ["src/pin"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
mypy_path = "src"
strict = true

[tool.uv]
required-version = ">=0.10.4,<0.11"

