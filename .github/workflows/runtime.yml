name: Runtime foundation

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux-x86_64:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: 0.10.4
          enable-cache: true
      - name: Install the locked runtime, development, and speech dependencies
        run: uv sync --locked --extra speech --dev
      - name: Check formatting and types
        run: |
          uv run ruff check .
          uv run mypy src
      - name: Verify architecture and role startup
        run: |
          uv run pin-architecture-check
          uv run pytest

